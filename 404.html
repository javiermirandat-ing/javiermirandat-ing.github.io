<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Over · Javier Miranda</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0b0f24; --gold: #ffd447; --ink: #f4f2ff; --muted: #9aa2d8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(ellipse at 50% 30%, #1a1f52, var(--bg) 70%);
      color: var(--ink); font: 700 16px/1.6 "Nunito", system-ui, sans-serif; text-align: center;
    }
    h1 {
      margin: 0 0 18px; font: clamp(28px, 8vw, 64px)/1.2 "Press Start 2P", monospace; color: #ff5d6c;
      text-shadow: 0 4px 0 #7a1622, 0 8px 0 #2a0b14;
    }
    p { margin: 0 0 26px; color: var(--muted); }
    a {
      display: inline-block; padding: 14px 18px; font: 11px/1.4 "Press Start 2P", monospace; color: #1a1030;
      background: var(--gold); border: 3px solid #1a1030; border-radius: 6px; text-decoration: none;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 4px 0 #1a1030;
      animation: blink 1.1s steps(2, start) infinite;
    }
    @keyframes blink { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { a { animation: none; } }
  </style>
</head>
<body>
  <main>
    <h1>GAME OVER</h1>
    <p>Esta página no existe · This page doesn't exist</p>
    <a href="/">CONTINUE?</a>
  </main>
</body>
</html>
