<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/demos/condominio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Avisos, gastos comunes por unidad y reservas de espacios comunes del condominio.">
  <meta name="theme-color" content="#1E4E8C">

  <!-- iPhone: "Agregar a pantalla de inicio" la deja como una app más. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Condominio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mi Condominio</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F3F5F9; }
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #26303D;
    }
    #carga img { width: 88px; height: 88px; border-radius: 24px; }
    #carga p { margin: 0; font-size: 15px; opacity: .75; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #11151B; }
      #carga { color: #DDE3EC; }
    }
  </style>
</head>
<body>
  <div id="carga">
    <img src="icons/Icon-192.png" alt="">
    <p>Cargando el condominio…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga');
      if (carga) carga.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
